name: release-testpypi

# Dry-run publish to TestPyPI via Trusted Publishing (OIDC). Triggered manually
# (Actions tab → "release-testpypi" → "Run workflow") so you control when a
# candidate goes up — TestPyPI also rejects a re-used version, so bump the
# version in pyproject.toml before re-running.
#
# One-time setup on TestPyPI (https://test.pypi.org/manage/account/publishing/):
#   Project name:   themisim
#   Owner:          jwjohnson314
#   Repository:     themisim
#   Workflow name:  release-testpypi.yml
#   Environment:    testpypi

on:
  workflow_dispatch:

jobs:
  testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
