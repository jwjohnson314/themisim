name: docs

# Build the Sphinx docs and deploy to GitHub Pages.
# Enable Pages once under Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        # --no-deps skips the heavy runtime stack (torch/faiss/…); conf.py mocks
        # those for autodoc. numpy + pandas are imported at module import time,
        # so they're installed for real.
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps .
          pip install sphinx furo "numpy>=1.24,<2" "pandas>=2.0" "pyarrow>=11" "Pillow>=9.4"
      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
